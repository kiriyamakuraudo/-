        .slot-container {
            background: #ffffff;

            text-align: center;
            max-width: 650px;

        }

            display: block;

            font-size: 1.2rem;
            margin-bottom: 5px;
            text-align: center;
            line-height: 1.8;
        }

        }
        .subtitle {
            color: #4b5563;
            font-size: 0.9rem;
            margin-bottom: 25px;
        }
        .slots-row {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 25px;
        }
        .slot-box {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .slot-label {
            font-size: 0.85rem;
            color: #6b7280;
            font-weight: bold;
        }
        .slot-window {
            background: #111827;
            border: 4px solid #4b5563;
            border-radius: 12px;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .slot-text {
            color: #10b981;
            font-size: 1.5rem;
            font-weight: bold;
            padding: 0 10px;
            word-break: break-all;
        }
        .slot-text.spinning {
            color: #f59e0b;
        }
        .slot-text.hit {
            color: #ef4444;
            transform: scale(1.05);
            transition: transform 0.1s;
        }
        /* 確率を表示するエリアのデザイン */
        .prob-badge {
            font-size: 0.75rem;
            color: #9ca3af;
            margin-top: 5px;
            font-weight: bold;
            min-height: 18px;
        }
        .controls {
            display: flex;
            justify-content: center;
        }
        /* 統合されたメインボタン */
        #main-slot-btn {
            width: 100%;
            background-color: #3b82f6; /* 最初は青色 */
            color: white;
            border: none;
            padding: 14px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(59, 130, 246, 0.3);
            transition: all 0.2s;
        }
        #main-slot-btn:hover {
            opacity: 0.9;
        }
        #main-slot-btn:disabled {
            background-color: #9ca3af !important; /* 無効時はグレー */
            cursor: not-allowed;
            box-shadow: none;
        }
    </style>

    let timers = [null, null, null];
    let isSpinning = false;
    let spinCount = 0; // 試行回数をカウントする変数

function getRandomItem(list) {
    const totalWeight = list.reduce((sum, item) => sum + item.weight, 0);
    let randomNum = Math.random() * totalWeight;
    
    for (const item of list) {
        if (randomNum < item.weight) {
            // ✨ 生の確率を計算
            const rawPercent = (item.weight / totalWeight) * 100;
            
            // ✨ どんなに小さくてもゼロに丸めない魔法の1行！
            // 有効数字（ゼロ以外の数字が出てから3桁分）を自動で残します
            const percentText = Number(rawPercent.toPrecision(3)).toString();

            return { text: item.text, percent: percentText };
        }
        randomNum -= item.weight;
    }
    return { text: list.text, percent: "0" };
}


    // ボタンが押されたときにスタートかストップかを振り分ける関数
    function handleSlotAction() {
        const btn = document.getElementById('main-slot-btn');

        if (!isSpinning) {
            // 🎰 まだ回っていないなら：スタート処理
            isSpinning = true;
            btn.textContent = "停止";
            btn.style.backgroundColor = "#ef4444"; // ボタンを赤色に

            // 全スロットの回転開始と画面リセット
            for (let i = 0; i < 3; i++) {
                const display = document.getElementById(`slot-${i+1}`);
                const probDisplay = document.getElementById(`prob-${i+1}`);

                display.classList.remove('hit');
                display.classList.add('spinning');
                probDisplay.textContent = ""; // 前回の確率表示を消す

                const currentList = slotData[`list${i+1}`];
                timers[i] = setInterval(() => {
                    const randomIndex = Math.floor(Math.random() * currentList.length);
                    display.textContent = currentList[randomIndex].text;
                }, 50);
            }
        } else {
            // 🛑 すでに回っているなら：ストップ処理
            // 連打バグを防ぐため、完全に止まるまでボタンを一時無効化
            btn.disabled = true;
            btn.textContent = "停止";

            // 時間差（0.3秒刻み）でスロットを1つずつ止めていく
            for (let i = 0; i < 3; i++) {
                setTimeout(() => {
                    clearInterval(timers[i]);
                    const display = document.getElementById(`slot-${i+1}`);
                    const probDisplay = document.getElementById(`prob-${i+1}`);

                    display.classList.remove('spinning');
                    display.classList.add('hit');

                    // 確率に基づいた結果を画面に反映
                    const currentList = slotData[`list${i+1}`];
                    const result = getRandomItem(currentList);
                    if (i === 2) {
                        result.percent = 50.0
                        }
                    if (i === 1) {
                        // 1 〜 100 のランダムな整数
                        const randomNumber = Math.random() * 90;
                        }

                        display.textContent = result.text;
                        probDisplay.textContent = `確率: ${result.percent}%`;

                    // 3つ目のスロットが完全に止まったら
                    if (i === 2) {
                        isSpinning = false;
                        btn.disabled = false; // ボタンを再度使えるように
                        btn.textContent = "動き";
                        btn.style.backgroundColor = "#3b82f6"; // ボタンを青色に戻す
                        spinCount++;

                        // 3つ目のスロットが止まった瞬間の文字を3つとも取得する
                        const w1 = document.getElementById('slot-1').textContent;
                        const w2 = document.getElementById('slot-2').textContent;
                        const w3 = document.getElementById('slot-3').textContent;

                        // 履歴リストの一番上に新しい結果を追加
                        const historyList = document.getElementById('history-list');
                        const newItem = document.createElement('li');
                        newItem.style.padding = "5px 0";
                        newItem.style.borderBottom = "1px solid #f3f4f6";
                        newItem.textContent = `${spinCount}回目： ${w1} ／ ${w2} ／ ${w3}`;
                        historyList.insertBefore(newItem, historyList.firstChild);

                        // 一番上に挿入
                        historyList.insertBefore(newItem, historyList.firstChild);

                    }
                }, i * 300);
            }
        }
    }
